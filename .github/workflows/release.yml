name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      packages: write
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify release version before publishing
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          package_version="$(jq -r .version packages/cli/package.json)"
          test "$package_version" = "$version"
      - name: Build release assets
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          mkdir -p dist
          for target in Linux:x86_64:linux:amd64 Linux:arm64:linux:arm64 Darwin:x86_64:darwin:amd64 Darwin:arm64:darwin:arm64; do
            IFS=: read -r os_label arch_label goos goarch <<< "$target"
            output="runneryard_${version}_${os_label}_${arch_label}"
            mkdir -p "dist/$output"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath \
              -ldflags="-s -w -X main.version=$version -X main.commitSHA=${GITHUB_SHA}" \
              -o "dist/$output/runneryard" ./cmd/runneryard
            tar -C "dist/$output" -czf "dist/$output.tar.gz" runneryard
            rm -r "dist/$output"
          done
          cd dist
          sha256sum *.tar.gz > "runneryard_${version}_checksums.txt"
      - name: Publish versioned controller and worker image
        env:
          GHCR_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/runneryard"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --platform linux/amd64 \
            --build-arg VERSION="$version" \
            --build-arg COMMIT_SHA="$GITHUB_SHA" \
            -t "$image:$version" .
          docker push "$image:$version"
      - name: Publish immutable GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*

  publish-npm:
    needs: release
    if: github.event.repository.visibility == 'public'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter runneryard test
      - name: Verify package version matches release
        working-directory: packages/cli
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$(node -p "require('./package.json').version")" = "${RELEASE_TAG#v}"
      - name: Publish immutable npm package
        working-directory: packages/cli
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if npm view "runneryard@$version" version --json >/dev/null 2>&1; then
            echo "runneryard@$version is already published; preserving the immutable registry artifact"
            exit 0
          fi
          npm publish

  publish-latest:
    needs: [release, publish-npm]
    if: >-
      always() &&
      needs.release.result == 'success' &&
      (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped')
    permissions:
      packages: write
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Advance latest after the complete release path
        env:
          GHCR_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/runneryard"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$image:$version"
          docker tag "$image:$version" "$image:latest"
          docker push "$image:latest"
