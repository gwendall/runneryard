name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      packages: write
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Checkout pinned setup-node canary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: actions/setup-node
          ref: 820762786026740c76f36085b0efc47a31fe5020
          path: .canary/setup-node
          persist-credentials: false
      - name: Verify release version before publishing
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          package_version="$(jq -r .version packages/cli/package.json)"
          test "$package_version" = "$version"
      - name: Build release assets
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          mkdir -p dist
          for target in Linux:x86_64:linux:amd64 Linux:arm64:linux:arm64 Darwin:x86_64:darwin:amd64 Darwin:arm64:darwin:arm64; do
            IFS=: read -r os_label arch_label goos goarch <<< "$target"
            output="runneryard_${version}_${os_label}_${arch_label}"
            mkdir -p "dist/$output"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath \
              -ldflags="-s -w -X main.version=$version -X main.commitSHA=${GITHUB_SHA}" \
              -o "dist/$output/runneryard" ./cmd/runneryard
            tar -C "dist/$output" -czf "dist/$output.tar.gz" runneryard
            rm -r "dist/$output"
          done
          cd dist
          sha256sum *.tar.gz > "runneryard_${version}_checksums.txt"
      - name: Publish versioned controller and worker image
        env:
          GHCR_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/runneryard"
          owner_type="$(gh api "/users/${GITHUB_REPOSITORY_OWNER}" --jq .type)"
          case "$owner_type" in
            User) package_owner_path="users/${GITHUB_REPOSITORY_OWNER}" ;;
            Organization) package_owner_path="orgs/${GITHUB_REPOSITORY_OWNER}" ;;
            *) echo "::error::Unsupported GitHub owner type: $owner_type"; exit 1 ;;
          esac
          existing_tags="$(mktemp)"
          trap 'rm -f "$existing_tags"' EXIT
          gh api --paginate \
            "/${package_owner_path}/packages/container/runneryard/versions?per_page=100" \
            --jq '.[] | .metadata.container.tags[]?' >"$existing_tags"
          for release_tag in "$version" "$version-amd64" "$version-arm64"; do
            if grep -Fxq "$release_tag" "$existing_tags"; then
              echo "::error::Refusing to overwrite immutable GHCR tag $image:$release_tag"
              exit 1
            fi
          done
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          node_version="$(sed -n 's/^ARG NODE_VERSION=//p' Dockerfile)"
          if [[ -z "$node_version" ]]; then
            echo "::error::Dockerfile does not declare ARG NODE_VERSION"
            exit 1
          fi
          for platform_and_arch in linux/amd64:amd64 linux/arm64:arm64; do
            IFS=: read -r platform arch <<< "$platform_and_arch"
            architecture_image="$image:$version-$arch"
            docker buildx build --platform "$platform" --load \
              --build-arg VERSION="$version" \
              --build-arg COMMIT_SHA="$GITHUB_SHA" \
              -t "$architecture_image" .
            bash scripts/verify-runtime-toolcache.sh \
              "$architecture_image" .canary/setup-node "$node_version" "$platform"
            docker push "$architecture_image"
          done
          docker buildx imagetools create \
            --tag "$image:$version" \
            "$image:$version-amd64" \
            "$image:$version-arm64"
          manifest="$(docker buildx imagetools inspect "$image:$version" --format '{{json .Manifest}}')"
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' \
            <<<"$manifest"
      - name: Create immutable GitHub release draft with every asset
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
      - name: Publish and verify the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release edit "$VERSION" --draft=false --verify-tag
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" --jq .immutable)" = true

  publish-npm:
    needs: release
    if: github.event.repository.visibility == 'public'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter runneryard test
      - name: Verify package version matches release
        working-directory: packages/cli
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$(node -p "require('./package.json').version")" = "${RELEASE_TAG#v}"
      - name: Publish immutable npm package
        working-directory: packages/cli
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if npm view "runneryard@$version" version --json >/dev/null 2>&1; then
            echo "runneryard@$version is already published; preserving the immutable registry artifact"
            exit 0
          fi
          npm publish

  publish-latest:
    needs: [release, publish-npm]
    if: >-
      always() &&
      needs.release.result == 'success' &&
      (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped')
    permissions:
      packages: write
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Advance latest after the complete release path
        env:
          GHCR_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/runneryard"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create --tag "$image:latest" "$image:$version"
          manifest="$(docker buildx imagetools inspect "$image:latest" --format '{{json .Manifest}}')"
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' \
            <<<"$manifest"
